name: Reportar un fallo
description: Algo no funciona como debería
labels: [fallo]
body:
  - type: textarea
    attributes:
      label: Qué pasó
      description: Qué dijiste o hiciste, qué esperabas y qué pasó en cambio.
    validations:
      required: true
  - type: input
    attributes:
      label: Versión
      description: La de Releases (p. ej. v0.1.0) o el commit.
    validations:
      required: true
  - type: input
    attributes:
      label: Entorno
      description: Distro, escritorio (Hyprland Lua/clásico, KDE…), GPU y modelo de Ollama.
      placeholder: "Arch, Hyprland (hyprland.conf), RX 6600, qwen3:8b"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Log
      description: El pedazo relevante de servidor.log (sin claves ni datos personales).
      render: text
